name: CI – Testes E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Execução diária (06:00 BRT) para detectar regressões nos sites testados
    - cron: "0 9 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Cypress (Chrome)
    runs-on: ubuntu-24.04  # versão fixa: reprodutível e suportada pelo Playwright
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cypress
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: cypress/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        run: npm test

      - name: Publicar relatório Mochawesome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: cypress/cypress/reports
          if-no-files-found: ignore
          retention-days: 30

      - name: Publicar vídeos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/cypress/videos
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar screenshots de falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-24.04  # versão fixa: reprodutível e suportada pelo Playwright
    # Imagem oficial com navegadores e dependências já instalados (versão = @playwright/test do lockfile)
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-noble
    timeout-minutes: 30
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Playwright
        run: npm test

      - name: Publicar relatório HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report
          if-no-files-found: ignore
          retention-days: 30

      - name: Publicar evidências (vídeos e traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: playwright/test-results
          if-no-files-found: ignore
          retention-days: 7
