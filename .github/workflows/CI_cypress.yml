name: cypress_CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cypress_tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install_dependencias
        working-directory: ./cypress
        run: npm install

      - name: executar_testes_Cypress
        working-directory: ./cypress
        run: npx cypress run --browser chrome --headless

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: ./cypress/cypress/screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: ./cypress/cypress/videos
          if-no-files-found: ignore
